<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Escolar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f3f6fa;color:#263238;display:flex;min-height:100vh}
.sidebar{width:245px;background:#123b67;color:white;min-height:100vh;padding:22px 14px}
.logo{font-size:22px;font-weight:bold;padding:10px 14px 25px}
.menu-btn{width:100%;border:0;background:transparent;color:white;text-align:left;padding:14px;border-radius:8px;font-size:16px;cursor:pointer;margin-bottom:5px}
.menu-btn:hover,.menu-btn.active{background:#1e568d}
.arrow{float:right;transition:.2s}
.menu-btn.active .arrow{transform:rotate(90deg)}
.submenu{display:none;padding-left:10px}
.submenu.show{display:block}
.sub-btn{width:100%;border:0;background:#0d3156;color:#eaf3fb;text-align:left;padding:12px;border-radius:7px;font-size:14px;cursor:pointer;margin:3px 0}
.sub-btn:hover{background:#27669d}
.main{flex:1}
.topbar{height:70px;background:white;display:flex;align-items:center;padding:0 30px;box-shadow:0 2px 8px #00000012}
.topbar h1{font-size:22px;color:#123b67}
.content{padding:35px}
.card{background:white;border-radius:14px;padding:28px;box-shadow:0 3px 14px #00000010;max-width:900px}
.card h2{color:#123b67;margin-bottom:10px}
.welcome{font-size:28px;margin-bottom:8px}
.cards{display:flex;gap:18px;flex-wrap:wrap;margin-top:25px}
.room{border:1px solid #dbe4ed;border-radius:12px;padding:22px;width:260px;cursor:pointer;background:#fff;transition:.2s}
.room:hover{transform:translateY(-3px);box-shadow:0 6px 18px #00000012}
.room h3{color:#123b67;margin-bottom:8px}
.room p{color:#657482}
.badge{display:inline-block;background:#e8f1fa;color:#16558a;padding:5px 9px;border-radius:20px;font-size:12px;margin-bottom:12px}

.login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#123b67,#1e568d);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
.login-box{width:min(420px,100%);background:white;border-radius:16px;padding:32px;box-shadow:0 15px 45px rgba(0,0,0,.25);text-align:center}
.login-box h2{color:#123b67;margin-bottom:8px}
.login-box p{color:#607d8b;margin-bottom:22px}
.login-box input{width:100%;padding:13px;margin:7px 0;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
.login-box button{width:100%;padding:13px;margin-top:12px;border:0;border-radius:8px;background:#123b67;color:white;font-size:16px;font-weight:bold;cursor:pointer}
.login-box button:hover{background:#1e568d}
.login-error{color:#c62828;margin-top:12px;min-height:20px;font-weight:bold}

.asistencia-control{position:relative;display:flex;align-items:center;gap:8px}
.circulo-asistencia{width:34px;height:34px;border:2px solid #cbd5df;border-radius:50%;background:#fff;cursor:pointer;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center}
.circulo-asistencia:hover{border-color:#123b67;background:#f5f9fc}
.circulo-asistencia.tiene-estado{border-color:transparent;color:#fff}.circulo-asistencia.estado-presente{background:#25a65a}.circulo-asistencia.estado-ausente{background:#e34b4b}.circulo-asistencia.estado-tardanza{background:#e3a321}.circulo-asistencia.estado-justificada{background:#3d82d6}
.estados-asistencia{display:none;gap:6px;align-items:center}
.estados-asistencia.abierto{display:flex}
.estado-btn{width:32px;height:32px;border:0;border-radius:50%;cursor:pointer;color:#fff;font-weight:800}
.estado-btn.presente{background:#25a65a}.estado-btn.ausente{background:#e34b4b}.estado-btn.tardanza{background:#e3a321}.estado-btn.justificada{background:#3d82d6}
.estado-btn.seleccionado{box-shadow:0 0 0 3px #d7e2ec}

.dojo-wrap{background:#f7fbff;border-radius:18px;padding:18px}.dojo-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.dojo-title{font-size:28px;font-weight:800;color:#263746}.dojo-tabs{display:flex;gap:8px}.dojo-tab{border:0;background:white;padding:9px 14px;border-radius:20px;cursor:pointer;font-weight:700}.dojo-tab.active{background:#1e88e5;color:white}.dojo-students{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.dojo-student{background:white;border:1px solid #e1eaf2;border-radius:18px;padding:16px;text-align:center;box-shadow:0 3px 12px rgba(30,60,90,.07)}.dojo-avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:58px;background:#e9f5ff;border:5px solid #d8ecfb}.dojo-points{font-size:25px;font-weight:800;color:#263746}.dojo-progress{height:9px;background:#e7eef4;border-radius:10px;overflow:hidden;margin:10px 0 14px}.dojo-progress>div{height:100%;background:#42a5f5;border-radius:10px}.dojo-open{width:100%;border:0;border-radius:10px;background:#1e88e5;color:#fff;padding:10px;font-weight:700;cursor:pointer}.dojo-modal-bg{position:fixed;inset:0;background:rgba(20,35,50,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.dojo-modal{background:#fff;border-radius:22px;width:min(720px,100%);max-height:90vh;overflow:auto;padding:22px}.dojo-modal-head{display:flex;align-items:center;gap:18px}.dojo-big-avatar{width:110px;height:110px;border-radius:50%;background:#e9f5ff;display:flex;align-items:center;justify-content:center;font-size:68px}.dojo-skill-tabs{display:flex;gap:8px;margin:20px 0 12px}.dojo-skills{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.dojo-skill{border:1px solid #dce6ee;border-radius:14px;padding:13px;background:#fff;cursor:pointer;text-align:left}.dojo-skill strong{display:block;font-size:16px}.dojo-skill small{color:#6b7b88}.dojo-skill.positive{border-left:5px solid #35b86b}.dojo-skill.negative{border-left:5px solid #ef6c6c}.dojo-close{border:0;background:#eef3f7;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}.dojo-rewards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:14px}.dojo-reward{background:white;border:1px solid #e1e8ef;border-radius:14px;padding:12px}.dojo-reward img{width:100%;height:100px;object-fit:cover;border-radius:10px}.dojo-history{margin-top:18px;border-top:1px solid #e4ebf1;padding-top:14px}.dojo-history-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f3f6}.dojo-add{border:0;background:#35b86b;color:#fff;border-radius:10px;padding:9px 13px;font-weight:700;cursor:pointer}.dojo-minus{border:0;background:#ef6c6c;color:#fff;border-radius:10px;padding:9px 13px;font-weight:700;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div style="font-size:48px;margin-bottom:10px">📚</div>
    <h2>Sistema Escolar</h2>
    <p>Inicia sesión para entrar al sistema</p>
    <form onsubmit="iniciarSesion(event)">
      <input id="usuarioLogin" type="text" placeholder="Usuario" autocomplete="username" required>
      <input id="contrasenaLogin" type="password" placeholder="Contraseña" autocomplete="current-password" required>
      <button type="submit">🔐 Ingresar</button>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>
</div>
<aside class="sidebar">
  <div class="logo">📚 Sistema Escolar</div>

  <button class="menu-btn" onclick="inicio()">🏠 Inicio</button>

  <button class="menu-btn" id="salonesBtn" onclick="toggleSalones()">
    🏫 Salones <span class="arrow">›</span>
  </button>

  <div class="submenu" id="salonesMenu"></div>

  <button class="menu-btn" id="alumnosBtn" onclick="toggleAlumnos()">
    👨‍🎓 Alumnos <span class="arrow">›</span>
  </button>

  <div class="submenu" id="alumnosMenu">
    <button class="sub-btn" onclick="mostrarTodosAlumnos()">👨‍🎓 Lista de alumnos</button>
    <button class="sub-btn" onclick="mostrarAsistencia()">✅ Asistencia</button>
    <button class="sub-btn" onclick="mostrarIncidencias()">⚠️ Incidencias</button>
  </div>

  <button class="menu-btn" onclick="mostrarClassDojo()">🥚 Class Dojo</button>
  <button class="menu-btn" onclick="mostrarMensajeria()">✉️ Mensajería <span id="badgeMensajes" style="float:right;background:#e34b4b;color:white;border-radius:12px;padding:2px 7px;font-size:11px;display:none"></span></button>
  <button class="menu-btn" onclick="proximamente('Profesores')">👩‍🏫 Profesores</button>
  <button class="menu-btn" onclick="proximamente('Horarios')">📅 Horarios</button>
  <button class="menu-btn" onclick="mostrarAjustes()">⚙️ Ajustes</button>
</aside>

<main class="main">
  <header class="topbar"><h1 id="titulo">Inicio</h1><span id="usuarioActualTop" style="margin-left:auto;color:#607d8b;font-weight:bold"></span></header>
  <section class="content" id="contenido">
    <div class="card">
      <div class="welcome">Bienvenido al sistema escolar 👋</div>
      <p>Usa el menú de la izquierda para entrar a <b>Salones</b>.</p>
    </div>
  </section>
</main>

<script>

function obtenerUsuarios(){
  const guardados=JSON.parse(localStorage.getItem('usuarios_sistema')||'{}');
  const eliminados=JSON.parse(localStorage.getItem('usuarios_eliminados')||'[]');
  const todos={...guardados};
  eliminados.forEach(n=>delete todos[n]);
  // Fallback mínimo para el administrador principal.
  if(!todos.ElFacupro) todos.ElFacupro={contrasena:'Molly2022',salon:'Secundaria B',profesor:'Profe Facundo',rol:'admin',permisos:permisosPorDefecto()};
  return todos;
}
function usuarioActual(){return sessionStorage.getItem('usuarioEscolar')||'';}
function datosUsuarioActual(){
  const nombre=usuarioActual();
  const guardado=obtenerUsuarios()[nombre];
  if(guardado)return guardado;
  try{return JSON.parse(sessionStorage.getItem('datosUsuarioEscolar')||'null');}catch(e){return null;}
}
function esAdmin(){return usuarioActual()==='ElFacupro';}
function permisosPorDefecto(){return {salon:true,alumnos:true,notas:true,asistencia:true,incidencias:true,horarios:true};}
function obtenerPermisos(nombre){
  const u=obtenerUsuarios()[nombre];
  return {...permisosPorDefecto(),...((u&&u.permisos)||{})};
}
function tienePermiso(nombre){return esAdmin()||obtenerPermisos(usuarioActual())[nombre]!==false;}
function alumnosVisibles(){
  const u=datosUsuarioActual();
  if(!u)return [];
  // Amaya (Secundaria Inglés) puede ver a TODOS los alumnos de todos los salones.
  // Como TODOS_ALUMNOS se reconstruye desde Supabase, los alumnos nuevos también aparecen aquí.
  if(u.salon==='Secundaria Ingles')return TODOS_ALUMNOS;
  return TODOS_ALUMNOS.filter(a=>a.salon===u.salon);
}
async function iniciarSesion(event){
  event.preventDefault();
  const usuario=document.getElementById('usuarioLogin').value.trim();
  const contrasena=document.getElementById('contrasenaLogin').value;
  const error=document.getElementById('loginError');
  try{
    const {data,error:err}=await db.from('Usuarios').select('usuario,contrasena,salon,rol').eq('usuario',usuario).neq('rol','eliminado');
    if(err)throw err;
    const u=(data||[]).find(x=>x.contrasena===contrasena);
    if(!u){error.textContent='Usuario o contraseña incorrectos';return;}
    const local=JSON.parse(localStorage.getItem('usuarios_sistema')||'{}');
    local[usuario]={...(local[usuario]||{}),contrasena:u.contrasena,salon:u.salon,rol:u.rol,profesor:profesorDeSalon(u.salon),permisos:(local[usuario]&&local[usuario].permisos)||permisosPorDefecto()};
    localStorage.setItem('usuarios_sistema',JSON.stringify(local));
    sessionStorage.setItem('sesionEscolar','activa');
    sessionStorage.setItem('usuarioEscolar',usuario);
    sessionStorage.setItem('datosUsuarioEscolar',JSON.stringify(local[usuario]));
    document.getElementById('loginScreen').style.display='none';
    error.textContent='';
    aplicarPermisos(); inicio();
  }catch(e){
    console.error(e);
    error.textContent='No se pudo conectar con Supabase: '+(e.message||e);
  }
}
function profesorDeSalon(salon){
  return {'Secundaria A':'Miss Gaela','Secundaria B':'Profe Facundo','Secundaria Ingles':'Amaya'}[salon]||'';
}
function aplicarPermisos(){
  const u=datosUsuarioActual(); if(!u)return;
  const p=obtenerPermisos(usuarioActual());
  const salones=document.getElementById('salonesMenu');
  const nombres={"Secundaria A":"Miss Gaela","Secundaria B":"Profe Facundo","Secundaria Ingles":"Amaya"};
  salones.innerHTML=p.salon?`<button class="sub-btn" onclick="mostrarSalon('${u.salon}','${nombres[u.salon]||u.profesor}')">${u.salon==='Secundaria Ingles'?'Secundaria Inglés':u.salon} — ${nombres[u.salon]||u.profesor}</button>`:'';
  let alumnosMenu='';
  if(p.alumnos) alumnosMenu+='<button class="sub-btn" onclick="mostrarTodosAlumnos()">👨‍🎓 Lista de alumnos</button>';
  if(p.asistencia) alumnosMenu+='<button class="sub-btn" onclick="mostrarAsistencia()">✅ Asistencia</button>';
  if(p.incidencias) alumnosMenu+='<button class="sub-btn" onclick="mostrarIncidencias()">⚠️ Incidencias</button>';
  document.getElementById('alumnosMenu').innerHTML=alumnosMenu||'<div style="padding:8px;color:#bcd0e3;font-size:13px">Sin permisos</div>';
  document.getElementById('usuarioActualTop').textContent='👤 '+usuarioActual();
}
function aplicarPermisos(){
  const u=datosUsuarioActual(); if(!u)return;
  const p=obtenerPermisos(usuarioActual());
  const salones=document.getElementById('salonesMenu');
  const nombres={"Secundaria A":"Miss Gaela","Secundaria B":"Profe Facundo","Secundaria Ingles":"Amaya"};
  salones.innerHTML=p.salon?`<button class="sub-btn" onclick="mostrarSalon('${u.salon}','${nombres[u.salon]||u.profesor}')">${u.salon==='Secundaria Ingles'?'Secundaria Inglés':u.salon} — ${nombres[u.salon]||u.profesor}</button>`:'';
  let alumnosMenu='';
  if(p.alumnos) alumnosMenu+='<button class="sub-btn" onclick="mostrarTodosAlumnos()">👨‍🎓 Lista de alumnos</button>';
  if(p.asistencia) alumnosMenu+='<button class="sub-btn" onclick="mostrarAsistencia()">✅ Asistencia</button>';
  if(p.incidencias) alumnosMenu+='<button class="sub-btn" onclick="mostrarIncidencias()">⚠️ Incidencias</button>';
  document.getElementById('alumnosMenu').innerHTML=alumnosMenu||'<div style="padding:8px;color:#bcd0e3;font-size:13px">Sin permisos</div>';
  document.getElementById('usuarioActualTop').textContent='👤 '+usuarioActual();
}

window.addEventListener('DOMContentLoaded',async()=>{
  try{await sincronizarDatosNube();}catch(e){console.warn(e);}
  const sesion=sessionStorage.getItem('sesionEscolar')==='activa';
  const nombre=usuarioActual();
  const usuarios=obtenerUsuarios();
  if(sesion && nombre && usuarios[nombre]){
    document.getElementById('loginScreen').style.display='none';
    aplicarPermisos();
  }else{
    sessionStorage.removeItem('sesionEscolar');
    sessionStorage.removeItem('usuarioEscolar');
    sessionStorage.removeItem('datosUsuarioEscolar');
  }
});


function toggleSalones(){
  const menu=document.getElementById('salonesMenu');
  const btn=document.getElementById('salonesBtn');
  menu.classList.toggle('show');
  btn.classList.toggle('active');
}
function toggleAlumnos(){
  const menu=document.getElementById('alumnosMenu');
  const btn=document.getElementById('alumnosBtn');
  menu.classList.toggle('show');
  btn.classList.toggle('active');
}

const TODOS_ALUMNOS = [
  {nombre:'Valentina', salon:'Secundaria A', profesor:'Miss Gaela'},
  {nombre:'Ian', salon:'Secundaria A', profesor:'Miss Gaela'},
  {nombre:'Sofia', salon:'Secundaria A', profesor:'Miss Gaela'},
  {nombre:'Sebas H', salon:'Secundaria A', profesor:'Miss Gaela'},
  {nombre:'Ethan', salon:'Secundaria B', profesor:'Profe Facundo'},
  {nombre:'Thiago', salon:'Secundaria B', profesor:'Profe Facundo'},
  {nombre:'Flavia', salon:'Secundaria B', profesor:'Profe Facundo'}
];
const alumnosGuardados=JSON.parse(localStorage.getItem('alumnos_sistema')||'null');
if(alumnosGuardados) TODOS_ALUMNOS.splice(0,TODOS_ALUMNOS.length,...alumnosGuardados);


function mostrarAsistencia(){
  if(!tienePermiso('asistencia')){alert('No tienes permiso para ver la asistencia.');return;}
  const u=datosUsuarioActual(); if(!u){return;}
  document.getElementById('titulo').textContent='Asistencia';
  const hoy=new Date().toISOString().slice(0,10);
  document.getElementById('contenido').innerHTML=`<div class="card"><span class="badge">CONTROL DE ASISTENCIA</span><h2>✅ Asistencia — ${u.salon}</h2><p style="margin-top:8px">Solo puedes ver y registrar la asistencia de tus alumnos.</p><div style="margin:18px 0"><label><b>Fecha:</b></label><input id="fechaAsistencia" type="date" value="${hoy}" style="padding:9px;border:1px solid #ccd7e2;border-radius:7px;margin-left:8px"></div><div id="listaAsistencia"></div><button onclick="guardarAsistencia()" style="margin-top:20px;padding:10px 16px;border:0;border-radius:7px;background:#123b67;color:white;cursor:pointer">💾 Guardar asistencia</button><span id="asistenciaMsg" style="display:block;margin-top:10px"></span></div>`;
  renderListaAsistencia();
}
function renderListaAsistencia(){
  const lista=document.getElementById('listaAsistencia'); if(!lista)return;
  const fecha=document.getElementById('fechaAsistencia').value;
  const guardado=JSON.parse(localStorage.getItem('asistencia_'+fecha+'_'+usuarioActual())||'{}');
  const visibles=alumnosVisibles();
  lista.innerHTML=visibles.map((a,i)=>{const estado=guardado[a.nombre]||'';return `<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #e5ebf1;padding:12px 0"><div style="flex:1;min-width:180px"><b>👤 ${a.nombre}</b><div style="font-size:13px;color:#657482">${a.salon||'Secundaria Ingles'} — ${a.profesor||'Amaya'}</div></div><div class="asistencia-control"><button type="button" class="circulo-asistencia ${estado?'tiene-estado estado-'+estado.toLowerCase():''}" id="circulo_${i}" onclick="abrirEstados(${i})">${estado?signoEstado(estado):''}</button><div class="estados-asistencia" id="estados_${i}"><button type="button" class="estado-btn presente" onclick="marcarAsistencia(${i},'Presente')">✓</button><button type="button" class="estado-btn ausente" onclick="marcarAsistencia(${i},'Ausente')">F</button><button type="button" class="estado-btn tardanza" onclick="marcarAsistencia(${i},'Tardanza')">T</button><button type="button" class="estado-btn justificada" onclick="marcarAsistencia(${i},'Justificada')">J</button></div></div></div>`}).join('')||'<p>No hay alumnos registrados en este salón.</p>';
  document.getElementById('fechaAsistencia').onchange=renderListaAsistencia;
}
function signoEstado(estado){return {Presente:'✓',Ausente:'F',Tardanza:'T',Justificada:'J'}[estado]||'';}
function abrirEstados(i){document.querySelectorAll('.estados-asistencia').forEach(e=>e.classList.remove('abierto'));const m=document.getElementById('estados_'+i);if(m)m.classList.add('abierto');}
function marcarAsistencia(i,estado){const fecha=document.getElementById('fechaAsistencia').value;const v=alumnosVisibles();if(!v[i])return;const d=JSON.parse(localStorage.getItem('asistencia_'+fecha+'_'+usuarioActual())||'{}');d[v[i].nombre]=estado;localStorage.setItem('asistencia_'+fecha+'_'+usuarioActual(),JSON.stringify(d));renderListaAsistencia();}

function guardarAsistencia(){
  const fecha=document.getElementById('fechaAsistencia').value;
  if(!fecha)return;
  const datos=JSON.parse(localStorage.getItem('asistencia_'+fecha+'_'+usuarioActual())||'{}');
  localStorage.setItem('asistencia_'+fecha+'_'+usuarioActual(),JSON.stringify(datos));
  document.getElementById('asistenciaMsg').textContent='✓ Asistencia guardada para '+fecha;
}

function mostrarAjustes(){
  document.getElementById('titulo').textContent='Ajustes'; const admin=esAdmin();
  document.getElementById('contenido').innerHTML=`<div class="card"><span class="badge">CONFIGURACIÓN</span><h2>⚙️ Ajustes</h2><p>Sesión: <b>${usuarioActual()}</b></p><div class="cards">${admin?'<div class="room" onclick="mostrarRegistroUsuario()"><h3>👤 Registrar usuario</h3><p>Crear usuario, contraseña y salón.</p></div><div class="room" onclick="mostrarGestionPermisos()"><h3>🔐 Usuarios y permisos</h3><p>Dar o quitar permisos a los usuarios registrados.</p></div><div class="room" onclick="mostrarCambioAlumnos()"><h3>👨‍🎓 Cambiar alumnos</h3><p>Mover alumnos entre salones.</p></div>':''}<div class="room" onclick="cerrarSesion()"><h3>🚪 Cerrar sesión</h3><p>Salir del sistema escolar.</p></div></div></div>`;
}
function mostrarGestionPermisos(){
  if(!esAdmin()){alert('Solo ElFacupro puede administrar permisos.');return;}
  document.getElementById('titulo').textContent='Usuarios y permisos';
  const usuarios=obtenerUsuarios();
  const nombres={salon:'Ver salón',alumnos:'Ver alumnos',notas:'Gestionar notas',asistencia:'Gestionar asistencia',incidencias:'Gestionar incidencias',horarios:'Ver horarios'};
  const filas=Object.keys(usuarios).filter(n=>n!=='ElFacupro').map(nombre=>{
    const u=usuarios[nombre], p=obtenerPermisos(nombre);

async function eliminarUsuario(nombre){
  if(!esAdmin()){alert('Solo ElFacupro puede eliminar usuarios.');return;}
  if(nombre==='ElFacupro'){alert('No puedes eliminar al administrador principal.');return;}
  if(!confirm('¿Eliminar al usuario '+nombre+'? Ya no aparecerá en usuarios, alumnos ni mensajería.'))return;
  try{
    const {data:encontrados,error:buscarError}=await db.from('Usuarios').select('id,usuario').eq('usuario',nombre);
    if(buscarError)throw buscarError;
    if(!encontrados||!encontrados.length){alert('Ese usuario no existe en Supabase.');return;}
    // Tombstone: mantiene la eliminación en la nube para que no reaparezca en otro Chrome.
    const {error}=await db.from('Usuarios').update({rol:'eliminado',salon:'',contrasena:''}).eq('usuario',nombre);
    if(error)throw error;
    await db.from('mensajes').delete().or(`remitente.eq.${nombre},destinatario.eq.${nombre}`);
    const guardados=JSON.parse(localStorage.getItem('usuarios_sistema')||'{}');
    delete guardados[nombre];
    localStorage.setItem('usuarios_sistema',JSON.stringify(guardados));
    const eliminados=JSON.parse(localStorage.getItem('usuarios_eliminados')||'[]');
    if(!eliminados.includes(nombre))eliminados.push(nombre);
    localStorage.setItem('usuarios_eliminados',JSON.stringify(eliminados));
    for(let i=TODOS_ALUMNOS.length-1;i>=0;i--)if(TODOS_ALUMNOS[i].nombre===nombre)TODOS_ALUMNOS.splice(i,1);
    localStorage.setItem('alumnos_sistema',JSON.stringify(TODOS_ALUMNOS));
    await sincronizarDatosNube();
    alert('✅ Usuario eliminado correctamente y sincronizado.');
    mostrarListaEliminarUsuarios();
  }catch(e){
    console.error('Error eliminando usuario:',e);
    alert('❌ No se pudo eliminar: '+(e.message||e));
  }
}

async function registrarUsuario(event){
  event.preventDefault(); if(!esAdmin())return;
  const usuario=document.getElementById('nuevoUsuario').value.trim();
  const contrasena=document.getElementById('nuevaContrasena').value;
  const salon=document.getElementById('nuevoSalon').value;
  const msg=document.getElementById('registroMsg');
  const rol=document.getElementById('nuevoRol').value;
  if(!usuario||!contrasena||!rol||!salon){msg.textContent='Completa usuario, contraseña, tipo y salón.';msg.style.color='#c62828';return;}
  try{
    const {data:existentes,error:checkError}=await db.from('Usuarios').select('id,usuario,rol').eq('usuario',usuario);
    if(checkError)throw checkError;
    const activos=(existentes||[]).filter(x=>x.rol!=='eliminado');
    const usuarioNormalizado=usuario.trim().toLowerCase();
    const duplicado=(activos||[]).some(x=>(x.usuario||'').trim().toLowerCase()===usuarioNormalizado);
    if(duplicado){msg.textContent='Ese usuario ya existe. No se pueden registrar duplicados.';msg.style.color='#c62828';return;}
    const tombstones=(existentes||[]).filter(x=>x.rol==='eliminado');
    if(tombstones.length){
      const {error:updateError}=await db.from('Usuarios').update({contrasena,salon,rol}).eq('usuario',usuario);
      if(updateError)throw updateError;
    }else{
      const {error:insertError}=await db.from('Usuarios').insert({usuario,contrasena,salon,rol});
      if(insertError)throw insertError;
    }

    // Verificación real: el registro debe existir en Supabase, no solo en este navegador.
    const {data:verificado,error:verificarError}=await db.from('Usuarios')
      .select('usuario,salon,rol')
      .eq('usuario',usuario)
      .eq('rol',rol);
    if(verificarError)throw verificarError;
    if(!verificado || !verificado.length){
      throw new Error('El usuario no quedó guardado en Supabase.');
    }

    const profesores={'Secundaria A':'Miss Gaela','Secundaria B':'Profe Facundo','Secundaria Ingles':'Amaya'};
    const guardados=JSON.parse(localStorage.getItem('usuarios_sistema')||'{}');
    guardados[usuario]={contrasena,salon,profesor:profesores[salon]||'',rol,permisos:permisosPorDefecto()};
    localStorage.setItem('usuarios_sistema',JSON.stringify(guardados));
    const eliminados=JSON.parse(localStorage.getItem('usuarios_eliminados')||'[]').filter(n=>n!==usuario);
    localStorage.setItem('usuarios_eliminados',JSON.stringify(eliminados));
    await sincronizarDatosNube();
    msg.textContent=rol==='alumno'?'✓ Alumno registrado correctamente.':'✓ Usuario registrado correctamente.';
    msg.style.color='#25a65a';
    document.getElementById('nuevoUsuario').value='';
    document.getElementById('nuevaContrasena').value='';
    document.getElementById('nuevoRol').value='';
    actualizarSalonesRegistro();
    mostrarListaEliminarUsuarios();
  }catch(e){
    console.error('Error registrando usuario:',e);
    msg.textContent='❌ No se pudo registrar: '+(e.message||e);
    msg.style.color='#c62828';
  }
}

async function eliminarAlumno(nombre){
  if(!esAdmin()){alert('Solo ElFacupro puede eliminar alumnos.');return;}
  if(!confirm('¿Eliminar al alumno '+nombre+'? Desaparecerá en todos los navegadores.'))return;
  try{
    const {data,error:buscarError}=await db.from('Usuarios').select('id,usuario').eq('usuario',nombre);
    if(buscarError)throw buscarError;
    if(data&&data.length){
      const {error}=await db.from('Usuarios').update({rol:'eliminado',salon:'',contrasena:''}).eq('usuario',nombre);
      if(error)throw error;
    }else{
      // Si todavía era un alumno base sin fila en la nube, crear su tombstone.
      const {error}=await db.from('Usuarios').insert({usuario:nombre,contrasena:'',salon:'',rol:'eliminado'});
      if(error)throw error;
    }
    await db.from('mensajes').delete().or(`remitente.eq.${nombre},destinatario.eq.${nombre}`);
    for(let i=TODOS_ALUMNOS.length-1;i>=0;i--)if(TODOS_ALUMNOS[i].nombre===nombre)TODOS_ALUMNOS.splice(i,1);
    localStorage.setItem('alumnos_sistema',JSON.stringify(TODOS_ALUMNOS));
    const eliminados=JSON.parse(localStorage.getItem('usuarios_eliminados')||'[]');
    if(!eliminados.includes(nombre))eliminados.push(nombre);
    localStorage.setItem('usuarios_eliminados',JSON.stringify(eliminados));
    delete JSON.parse(localStorage.getItem('usuarios_sistema')||'{}')[nombre];
    await sincronizarDatosNube();
    alert('✅ Alumno eliminado y sincronizado.');
    mostrarCambioAlumnos();
  }catch(e){console.error(e);alert('❌ No se pudo eliminar al alumno: '+(e.message||e));}
}

function actualizarDias(id){
  const lista=document.getElementById(id+'_lista');
  const filas=[...lista.querySelectorAll('.nota-fila')];
  const fechas=[...new Set(filas.map(f=>f.querySelector('.fecha-nota').value).filter(Boolean))].sort();
  filas.forEach(fila=>{
    const fecha=fila.querySelector('.fecha-nota').value;
    const label=fila.querySelector('.dia-label');
    if(!fecha){ label.textContent='Día —:'; return; }
    const dia=fechas.indexOf(fecha)+1;
    label.textContent='Día '+dia+':';
  });
}

function agregarNota(id,nombre){
  const lista=document.getElementById(id+'_lista');
  const numero=lista.querySelectorAll('.nota-fila').length+1;
  lista.insertAdjacentHTML('beforeend',crearNota(id,nombre,numero));
  actualizarDias(id);
  lista.querySelectorAll('.fecha-nota').forEach(input=>input.onchange=()=>actualizarDias(id));
}

function guardarTodas(id,nombre){
  const lista=document.getElementById(id+'_lista');
  const filas=lista.querySelectorAll('.nota-fila');
  const registros=[];
  let valido=true;

  filas.forEach((fila)=>{
    const fecha=fila.querySelector('.fecha-nota').value;
    const nota=fila.querySelector('.valor-nota').value;
    if(fecha && nota){
      registros.push({fecha,nota});
    } else if(fecha || nota){
      valido=false;
    }
  });

  const mensaje=document.getElementById(id+'_msg');
  if(!valido){
    mensaje.textContent='Completa la fecha y la nota de cada registro.';
    return;
  }

  localStorage.setItem(id,JSON.stringify(registros));
  mensaje.textContent='✓ Notas guardadas: '+registros.length;
  actualizarDias(id);
}

async function sincronizarDatosNube(){
  const profesores={'Secundaria A':'Miss Gaela','Secundaria B':'Profe Facundo','Secundaria Ingles':'Amaya'};
  try{
    // Supabase es la fuente de verdad. No usamos localStorage para decidir
    // qué alumnos existen en la nube.
    const {data,error}=await db.from('Usuarios')
      .select('usuario,contrasena,salon,rol')
      .order('usuario');
    if(error)throw error;

    const filas=data||[];
    const activosRaw=filas.filter(u=>u.usuario && u.rol!=='eliminado');

    // Si por alguna razón ya existen filas duplicadas en Supabase,
    // mostramos y sincronizamos solo una por usuario.
    const vistosUsuarios=new Set();
    const activos=activosRaw.filter(u=>{
      const clave=(u.usuario||'').trim().toLowerCase();
      if(vistosUsuarios.has(clave)) return false;
      vistosUsuarios.add(clave);
      return true;
    });

    const usuariosLocales=JSON.parse(localStorage.getItem('usuarios_sistema')||'{}');
    const nombresCloud=new Set(activos.map(u=>u.usuario));

    for(const u of activos){
      const anterior=usuariosLocales[u.usuario]||{};
      usuariosLocales[u.usuario]={
        ...anterior,
        contrasena:u.contrasena||'',
        salon:u.salon||'',
        profesor:profesores[u.salon]||anterior.profesor||u.usuario,
        rol:u.rol||'usuario',
        permisos:anterior.permisos||permisosPorDefecto()
      };
    }

    for(const nombre of Object.keys(usuariosLocales)){
      if(nombre!=='ElFacupro' && !nombresCloud.has(nombre)){
        delete usuariosLocales[nombre];
      }
    }
    localStorage.setItem('usuarios_sistema',JSON.stringify(usuariosLocales));

    // IMPORTANTE: cada navegador reconstruye la lista de alumnos directamente
    // desde Supabase. Así Gaetano y cualquier alumno nuevo aparecen en todos.
    const alumnosCloud=activos
      .filter(u=>u.rol==='alumno' && u.usuario)
      .map(u=>({
        nombre:u.usuario,
        salon:u.salon||'Secundaria A',
        profesor:profesores[u.salon]||''
      }));

    TODOS_ALUMNOS.splice(0,TODOS_ALUMNOS.length,...alumnosCloud);
    localStorage.setItem('alumnos_sistema',JSON.stringify(TODOS_ALUMNOS));

    return activos;
  }catch(e){
    console.error('ERROR REAL DE SINCRONIZACIÓN:',e);
    throw e;
  }
}

  document.getElementById('contenido').innerHTML=`<div class="card"><span class="badge">CONTROL DE ASISTENCIA</span><h2>✅ Asistencia — ${u.salon}</h2><p style="margin-top:8px">Los cambios se guardan en la nube.</p><div style="margin:18px 0"><label><b>Fecha:</b></label><input id="fechaAsistencia" type="date" value="${hoy}" style="padding:9px;border:1px solid #ccd7e2;border-radius:7px;margin-left:8px"></div><div id="listaAsistencia">Cargando…</div><button onclick="guardarAsistencia()" style="margin-top:20px;padding:10px 16px;border:0;border-radius:7px;background:#123b67;color:white;cursor:pointer">💾 Guardar asistencia</button><span id="asistenciaMsg" style="display:block;margin-top:10px"></span></div>`;
  await renderListaAsistencia();
}
async function renderListaAsistencia(){
  const lista=document.getElementById('listaAsistencia'); if(!lista)return;
  const fecha=document.getElementById('fechaAsistencia').value;
  const guardado=await cargarAsistenciaCloud(fecha);
  const visibles=alumnosVisibles();
  lista.innerHTML=visibles.map((a,i)=>{const estado=guardado[a.nombre]||'';return `<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #e5ebf1;padding:12px 0"><div style="flex:1;min-width:180px"><b>👤 ${a.nombre}</b><div style="font-size:13px;color:#657482">${a.salon} — ${a.profesor}</div></div><div class="asistencia-control"><button type="button" class="circulo-asistencia ${estado?'tiene-estado estado-'+estado.toLowerCase():''}" id="circulo_${i}" onclick="abrirEstados(${i})">${estado?signoEstado(estado):''}</button><div class="estados-asistencia" id="estados_${i}"><button type="button" class="estado-btn presente" onclick="marcarAsistencia(${i},'Presente')">✓</button><button type="button" class="estado-btn ausente" onclick="marcarAsistencia(${i},'Ausente')">F</button><button type="button" class="estado-btn tardanza" onclick="marcarAsistencia(${i},'Tardanza')">T</button><button type="button" class="estado-btn justificada" onclick="marcarAsistencia(${i},'Justificada')">J</button></div></div></div>`}).join('')||'<p>No hay alumnos registrados.</p>';
  document.getElementById('fechaAsistencia').onchange=renderListaAsistencia;
}
async function marcarAsistencia(i,estado){
  const fecha=document.getElementById('fechaAsistencia').value; const v=alumnosVisibles(); if(!v[i])return;
  const datos=await cargarAsistenciaCloud(fecha); datos[v[i].nombre]=estado;
  try{await guardarAsistenciaCloud(fecha,datos); await renderListaAsistencia();}catch(e){console.error(e);alert('No se pudo guardar la asistencia en la nube.');}
}
async function guardarAsistencia(){
  const fecha=document.getElementById('fechaAsistencia').value; if(!fecha)return;
  const datos=await cargarAsistenciaCloud(fecha);
  try{await guardarAsistenciaCloud(fecha,datos);document.getElementById('asistenciaMsg').textContent='✓ Asistencia guardada en Supabase';}catch(e){console.error(e);alert('No se pudo guardar la asistencia.');}
}

async function cargarNotasCloud(nombre,salon){
  const {data,error}=await db.from('notas').select('*').eq('usuario',usuarioActual()).eq('alumno',nombre).eq('salon',salon).order('fecha',{ascending:true});
  if(error){console.error(error);return [];} return data||[];
}
function pintarNotasEnLista(id,datos){
  const lista=document.getElementById(id+'_lista'); if(!lista)return;
  lista.innerHTML=datos.length?datos.map((r,i)=>crearNota(id,'',i+1)).join(''):crearNota(id,'',1);
  const filas=lista.querySelectorAll('.nota-fila');
  datos.forEach((r,i)=>{if(filas[i]){filas[i].querySelector('.fecha-nota').value=r.fecha;filas[i].querySelector('.valor-nota').value=r.nota;}});
  actualizarDias(id);
  lista.querySelectorAll('.fecha-nota').forEach(input=>input.onchange=()=>actualizarDias(id));
}
async function mostrarNotasAlumno(nombre,salon,profesor){
  if(!tienePermiso('notas')){alert('No tienes permiso para gestionar notas.');return;}
  document.getElementById('titulo').textContent='Notas de '+nombre;
  const id='notas_'+salon.replace(/\s/g,'_')+'_'+nombre.replace(/\s/g,'_');
  document.getElementById('contenido').innerHTML=`<div class="card"><span class="badge">NOTAS DEL ALUMNO</span><h2>📝 ${nombre}</h2><p style="margin-top:8px">${salon} — ${profesor}</p><div style="margin-top:20px">${alumnoConNota(nombre,salon)}</div><button onclick="mostrarAlumnos('${salon}','${profesor}')" style="margin-top:20px;padding:10px 15px;border:0;border-radius:7px;background:#123b67;color:white;cursor:pointer">← Volver a alumnos</button></div>`;
  const datos=await cargarNotasCloud(nombre,salon); pintarNotasEnLista(id,datos);
}
async function guardarTodas(id,nombre){
  const lista=document.getElementById(id+'_lista'); const filas=lista.querySelectorAll('.nota-fila'); const registros=[]; let valido=true;
  filas.forEach(f=>{const fecha=f.querySelector('.fecha-nota').value,nota=f.querySelector('.valor-nota').value;if(fecha&&nota)registros.push({fecha,nota});else if(fecha||nota)valido=false;});
  const mensaje=document.getElementById(id+'_msg'); if(!valido){mensaje.textContent='Completa la fecha y la nota de cada registro.';return;}
  const salon=datosUsuarioActual()?.salon; if(!salon)return;
  try{
    const {error:delError}=await db.from('notas').delete().eq('usuario',usuarioActual()).eq('alumno',nombre).eq('salon',salon); if(delError)throw delError;
    if(registros.length){const rows=registros.map(r=>({usuario:usuarioActual(),alumno:nombre,salon,fecha:r.fecha,nota:r.nota}));const {error}=await db.from('notas').insert(rows);if(error)throw error;}
    localStorage.setItem(id,JSON.stringify(registros)); mensaje.textContent='✓ Notas guardadas en Supabase: '+registros.length; actualizarDias(id);
  }catch(e){console.error(e);mensaje.textContent='No se pudieron guardar las notas en la nube.';}
}
async function mostrarHistorial(id,nombre,salon){
  const datos=await cargarNotasCloud(nombre,salon); document.getElementById('titulo').textContent='Historial de notas';
  let html='<div class="card"><span class="badge">HISTORIAL</span><h2>📋 Historial de '+nombre+'</h2><p style="margin-top:8px">'+salon+'</p>';
  if(!datos.length)html+='<div style="margin-top:20px;padding:15px;background:#f3f6fa;border-radius:10px">No hay notas guardadas todavía.</div>';
  else {const porFecha={};datos.forEach(r=>(porFecha[r.fecha]??=[]).push(r));Object.keys(porFecha).sort().forEach((fecha,i)=>{html+='<div style="margin-top:20px;border:1px solid #dbe4ed;border-radius:10px;padding:15px"><h3 style="color:#123b67">Día '+(i+1)+' — '+fecha+'</h3>';porFecha[fecha].forEach((r,j)=>html+='<p style="margin-top:8px">Nota '+(j+1)+': <b>'+r.nota+'</b></p>');html+='</div>';});}
  html+='<button onclick="mostrarTodosAlumnos()" style="margin-top:20px;padding:10px 15px;border:0;border-radius:7px;background:#123b67;color:white;cursor:pointer">← Volver a alumnos</button></div>'; document.getElementById('contenido').innerHTML=html;
}

async function registrarIncidencia(nombre){
  const detalle=prompt('Escribe la incidencia de '+nombre+':'); if(!detalle)return;
  const a=TODOS_ALUMNOS.find(x=>x.nombre===nombre); const {error}=await db.from('incidencias').insert({usuario:usuarioActual(),alumno:nombre,salon:a?.salon||datosUsuarioActual()?.salon||'',fecha:new Date().toISOString().slice(0,10),texto:detalle});
  if(error){console.error(error);alert('No se pudo guardar la incidencia en la nube.');return;} alert('✓ Incidencia guardada en Supabase.');
}

async function obtenerMensajesCloud(){
  const u=usuarioActual(); const {data,error}=await db.from('mensajes').select('*').or(`remitente.eq.${u},destinatario.eq.${u}`).order('fecha',{ascending:false});
  if(error){console.error(error);return [];} return (data||[]).map(m=>({id:m.id,remitente:m.remitente,destinatario:m.destinatario,asunto:m.asunto,texto:m.mensaje,fecha:m.fecha,leido:m.leido}));
}
async function obtenerUsuariosCloud(){
  const {data,error}=await db.from('Usuarios').select('usuario,salon,rol');
  if(error){console.error(error);return [];}
  return (data||[]).map(x=>x.usuario).filter(Boolean);
}
async function actualizarBadgeMensajes(){
  const b=document.getElementById('badgeMensajes');if(!b)return;const msgs=await obtenerMensajesCloud();const n=msgs.filter(m=>m.destinatario===usuarioActual()&&!m.leido).length;b.textContent=n;b.style.display=n?'inline-block':'none';
}
async function mostrarMensajeria(){
  const u=usuarioActual();if(!u)return;document.getElementById('titulo').textContent='Mensajería';const mensajes=await obtenerMensajesCloud();const usuarios=(await obtenerUsuariosCloud()).filter(n=>n!==u);
  document.getElementById('contenido').innerHTML=`<div class="card" style="max-width:1000px"><span class="badge">MENSAJERÍA</span><h2>✉️ Mensajes</h2><form onsubmit="enviarMensaje(event)" style="margin-top:20px;padding:18px;background:#f6f9fc;border-radius:12px"><select id="destinatarioMensaje" required style="width:100%;padding:11px;margin-bottom:10px;border:1px solid #ccd7e2;border-radius:8px"><option value="">Selecciona usuario</option>${usuarios.map(x=>`<option value="${x}">${x}</option>`).join('')}</select><input id="asuntoMensaje" required placeholder="Asunto" style="width:100%;padding:11px;margin-bottom:10px;border:1px solid #ccd7e2;border-radius:8px"><textarea id="textoMensaje" required placeholder="Escribe tu mensaje..." style="width:100%;min-height:110px;padding:11px;border:1px solid #ccd7e2;border-radius:8px;resize:vertical"></textarea><button type="submit" style="margin-top:10px;padding:11px 18px;border:0;border-radius:8px;background:#123b67;color:white;cursor:pointer">📨 Enviar</button></form><h3 style="margin-top:25px;color:#123b67">📥 Bandeja</h3><div style="margin-top:12px">${mensajes.map(m=>`<div onclick="leerMensajeCloud(${m.id})" style="padding:14px;border:1px solid #dbe4ed;border-radius:10px;margin:8px 0;cursor:pointer;background:${m.destinatario===u&&!m.leido?'#eef6ff':'white'}"><b>${m.destinatario===u?'De: '+m.remitente:'Para: '+m.destinatario}</b><div style="margin-top:4px"><strong>${m.asunto}</strong></div><div style="color:#657482;margin-top:4px">${m.texto.slice(0,100)}${m.texto.length>100?'…':''}</div><small style="color:#8997a3">${m.fecha}${m.destinatario===u&&!m.leido?' · NUEVO':''}</small></div>`).join('')||'<p style="color:#71808c;margin-top:10px">No tienes mensajes todavía.</p>'}</div></div>`;
  actualizarBadgeMensajes();
}
async function enviarMensaje(event){
  event.preventDefault();const destinatario=document.getElementById('destinatarioMensaje').value,asunto=document.getElementById('asuntoMensaje').value.trim(),texto=document.getElementById('textoMensaje').value.trim();
  const {error}=await db.from('mensajes').insert({remitente:usuarioActual(),destinatario,asunto,mensaje:texto,leido:false});
  if(error){console.error(error);alert('No se pudo enviar el mensaje.');return;}alert('✓ Mensaje enviado.');mostrarMensajeria();
}
async function leerMensajeCloud(id){
  const {data,error}=await db.from('mensajes').select('*').eq('id',id).single();if(error||!data)return;
  if(data.destinatario===usuarioActual())await db.from('mensajes').update({leido:true}).eq('id',id);
  alert('De: '+data.remitente+'\nPara: '+data.destinatario+'\nAsunto: '+data.asunto+'\n\n'+data.mensaje);mostrarMensajeria();
}

async function puntosDojoCloud(nombre){
  const {data,error}=await db.from('dojo_puntos').select('puntos').eq('usuario',usuarioActual()).eq('alumno',nombre);
  if(error){console.error(error);return 0;}return (data||[]).reduce((s,r)=>s+Number(r.puntos||0),0);
}
async function historialDojoCloud(nombre){
  const {data,error}=await db.from('dojo_puntos').select('*').eq('usuario',usuarioActual()).eq('alumno',nombre).order('fecha',{ascending:false}).limit(30);
  if(error){console.error(error);return [];}return (data||[]).map(r=>({fecha:r.fecha,cambio:r.puntos,skill:r.skill}));
}
async function registrarMovimientoCloud(nombre,cambio,skill){
  const a=TODOS_ALUMNOS.find(x=>x.nombre===nombre);const {error}=await db.from('dojo_puntos').insert({usuario:usuarioActual(),alumno:nombre,salon:a?.salon||datosUsuarioActual()?.salon||'',puntos:cambio,skill});
  if(error)throw error;
}
async function mostrarClassDojo(){
  if(!profesorPuedeManipularDojo()){alert('Solo los profesores pueden manipular Class Dojo.');return;}
  document.getElementById('titulo').textContent='Class Dojo';
  document.getElementById('contenido').innerHTML='<div class="dojo-wrap"><div class="dojo-top"><div><div class="dojo-title">🥚 Class Dojo</div><p style="margin:4px 0;color:#687887">Puntos sincronizados en la nube.</p></div><div class="dojo-tabs"><button class="dojo-tab active">👥 Alumnos</button><button class="dojo-tab" onclick="mostrarRecompensasDojo()">🏆 Recompensas</button></div></div><div class="dojo-students" id="dojoLista">Cargando…</div></div>';
  const box=document.getElementById('dojoLista');const students=estudiantesDojo();const vals=await Promise.all(students.map(async a=>[a,await puntosDojoCloud(a.nombre)]));
  box.innerHTML=vals.map(([a,p])=>`<div class="dojo-student"><div class="dojo-avatar">${p>=10?'👾':'🥚'}</div><h3 style="margin:5px 0">${a.nombre}</h3><div class="dojo-points">${p} puntos</div><div class="dojo-progress"><div style="width:${Math.min(100,p*10)}%"></div></div><p style="margin:0 0 12px;color:#71808c">${p>=10?'👾 ¡Tu monstruo ha eclosionado!':(10-p)+' puntos para eclosionar'}</p><button class="dojo-open" onclick="abrirAlunoDojoCloud('${a.nombre.replace(/'/g,"\\'")}')">Ver alumno</button></div>`).join('')||'<p>No hay alumnos.</p>';
}
async function abrirAlunoDojoCloud(nombre){
  if(!estudiantesDojo().some(a=>a.nombre===nombre))return;const p=await puntosDojoCloud(nombre),hist=await historialDojoCloud(nombre),skills=obtenerSkills();
  const modal=document.createElement('div');modal.className='dojo-modal-bg';modal.id='dojoModal';modal.innerHTML=`<div class="dojo-modal"><div style="display:flex;justify-content:flex-end"><button class="dojo-close" onclick="cerrarDojoModal()">✕ Cerrar</button></div><div class="dojo-modal-head"><div class="dojo-big-avatar">${p>=10?'👾':'🥚'}</div><div><h2 style="margin:0">${nombre}</h2><div class="dojo-points">${p} puntos</div><p style="margin:4px 0;color:#687887">${p>=10?'👾 Monstruo eclosionado':'🥚 Huevo — '+(10-p)+' puntos para eclosionar'}</p></div></div><div class="dojo-progress" style="margin-top:18px"><div style="width:${Math.min(100,p*10)}%"></div></div><div class="dojo-skill-tabs"><button class="dojo-tab active" onclick="renderSkillsDojoCloud('positive','${nombre.replace(/'/g,"\\'")}')">✨ Positivo</button><button class="dojo-tab" onclick="renderSkillsDojoCloud('negative','${nombre.replace(/'/g,"\\'")}')">⚠️ Necesita mejorar</button></div><div id="dojoSkills" class="dojo-skills"></div><div class="dojo-history"><h3>Últimos movimientos</h3><div id="dojoHistory">${hist.slice(0,8).map(h=>`<div class="dojo-history-row"><span>${h.skill}</span><b>${h.cambio>0?'+':''}${h.cambio}</b></div>`).join('')||'<p style="color:#788896">Todavía no hay puntos.</p>'}</div></div></div>`;document.body.appendChild(modal);renderSkillsDojoCloud('positive',nombre);
}
function renderSkillsDojoCloud(tipo,nombre){const box=document.getElementById('dojoSkills');if(!box)return;box.innerHTML=obtenerSkills().filter(s=>s.tipo===tipo).map(s=>`<button class="dojo-skill ${s.tipo}" onclick="darSkillDojoCloud('${nombre.replace(/'/g,"\\'")}',${s.puntos},'${s.nombre.replace(/'/g,"\\'")}')"><strong>${s.icono} ${s.nombre}</strong><small>${s.puntos>0?'+':''}${s.puntos} punto${Math.abs(s.puntos)===1?'':'s'}</small></button>`).join('');}
async function darSkillDojoCloud(nombre,puntos,skill){if(!profesorPuedeManipularDojo()||!estudiantesDojo().some(a=>a.nombre===nombre))return;try{await registrarMovimientoCloud(nombre,puntos,skill);cerrarDojoModal();await mostrarClassDojo();await abrirAlunoDojoCloud(nombre);}catch(e){console.error(e);alert('No se pudo guardar el movimiento en la nube.');}}
async function mostrarRecompensasDojo(){
 if(!profesorPuedeManipularDojo())return;document.getElementById('titulo').textContent='Class Dojo — Recompensas';document.getElementById('contenido').innerHTML='<div class="dojo-wrap"><div class="dojo-top"><div><div class="dojo-title">🏆 Recompensas</div><p style="margin:4px 0;color:#687887">Recompensas sincronizadas en la nube.</p></div><button class="dojo-close" onclick="mostrarClassDojo()">← Volver a alumnos</button></div><form onsubmit="crearRecompensa(event)" style="display:flex;gap:8px;flex-wrap:wrap;background:white;padding:15px;border-radius:14px"><input id="recompNombre" required placeholder="Nombre de recompensa" style="padding:10px;border:1px solid #ccd7e2;border-radius:8px"><select id="recompPuntos" style="padding:10px;border:1px solid #ccd7e2;border-radius:8px"><option value="1">1 punto</option><option value="2">2 puntos</option><option value="3">3 puntos</option></select><input id="recompImagen" type="file" accept="image/*" style="padding:7px"><button class="dojo-add" type="submit">+ Crear recompensa</button></form><div id="dojoRecompensas" class="dojo-rewards">Cargando…</div></div>';await renderRecompensasCloud();
}
async function renderRecompensasCloud(){const box=document.getElementById('dojoRecompensas');if(!box)return;const {data,error}=await db.from('dojo_recompensas').select('*').order('fecha',{ascending:false});if(error){box.textContent='No se pudieron cargar las recompensas.';return;}box.innerHTML=(data||[]).map(r=>`<div class="dojo-reward">${r.imagen?`<img src="${r.imagen}">`:''}<h3 style="margin:9px 0">${r.nombre}</h3><b>⭐ ${r.puntos} punto${r.puntos==1?'':'s'}</b><small style="display:block;margin-top:5px;color:#71808c">Creada por ${r.creador}</small></div>`).join('')||'<p>No hay recompensas creadas todavía.</p>';}
async function crearRecompensa(event){event.preventDefault();if(!profesorPuedeManipularDojo())return;const nombre=document.getElementById('recompNombre').value.trim(),puntos=Number(document.getElementById('recompPuntos').value),file=document.getElementById('recompImagen').files[0];if(!file){alert('Selecciona una imagen para la recompensa.');return;}const reader=new FileReader();reader.onload=async()=>{const {error}=await db.from('dojo_recompensas').insert({creador:usuarioActual(),nombre,puntos,imagen:reader.result});if(error){console.error(error);alert('No se pudo guardar la recompensa.');return;}await mostrarRecompensasDojo();};reader.readAsDataURL(file);}

/* login desde la tabla Usuarios; se mantiene respaldo local para las cuentas ya guardadas */
async function iniciarSesion(event){
  event.preventDefault();const usuario=document.getElementById('usuarioLogin').value.trim(),contrasena=document.getElementById('contrasenaLogin').value,error=document.getElementById('loginError');
  let ok=false;
  try{const {data:rows}=await db.from('Usuarios').select('usuario,contrasena,salon,rol').eq('usuario',usuario).eq('contrasena',contrasena).limit(1);
    const data=rows && rows[0];if(data){ok=true;sessionStorage.setItem('datosUsuarioEscolar',JSON.stringify({usuario:data.usuario,contrasena:data.contrasena,salon:data.salon,profesor:({'Secundaria A':'Miss Gaela','Secundaria B':'Profe Facundo','Secundaria Ingles':'Amaya'}[data.salon]||data.usuario),rol:data.rol,permisos:permisosPorDefecto()}));}}catch(e){console.error(e);}
  if(!ok){const us=obtenerUsuarios();ok=!!(us[usuario]&&us[usuario].contrasena===contrasena);}
  if(ok){sessionStorage.setItem('sesionEscolar','activa');sessionStorage.setItem('usuarioEscolar',usuario);await sincronizarDatosNube();document.getElementById('loginScreen').style.display='none';error.textContent='';aplicarPermisos();inicio();actualizarBadgeMensajes();}else error.textContent='Usuario o contraseña incorrectos';
}

/* refresca mensajes al volver a la pestaña */
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&usuarioActual())actualizarBadgeMensajes();});

sincronizarDatosNube().then(()=>{ if(usuarioActual()) { aplicarPermisos(); actualizarBadgeMensajes(); } });
actualizarBadgeMensajes();
</script>
